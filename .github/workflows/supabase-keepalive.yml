# Supabase 무료 플랜은 7일간 트래픽이 없으면 프로젝트를 자동 정지시킨다.
# 정지되면 배포된 웹앱의 로그인·방명록이 모두 죽는다.
# 주 2회 가벼운 요청을 보내 타이머를 초기화한다.
#
# 필요한 저장소 시크릿 (Settings > Secrets and variables > Actions):
#   SUPABASE_URL       = https://xxxx.supabase.co
#   SUPABASE_ANON_KEY  = eyJhbGciOi...

name: Supabase keep-alive

on:
  schedule:
    # 매주 월·목 03:17 UTC (한국시간 12:17)
    - cron: '17 3 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY 시크릿이 설정되지 않았습니다."
            exit 1
          fi

          code=$(curl -sS -o /tmp/out.txt -w '%{http_code}' \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')

          echo "HTTP $code — $(cat /tmp/out.txt)"

          if [ "$code" != "200" ]; then
            echo "::error::keep-alive 실패 (HTTP $code). 프로젝트가 이미 정지됐을 수 있으니 대시보드에서 Restore 하세요."
            exit 1
          fi
